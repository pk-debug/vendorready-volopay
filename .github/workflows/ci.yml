name: VendorReady CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test, type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Type-check TypeScript
        run: npm run check
      - name: Build the web application
        run: npm run build
      - name: Verify there are no model API keys or model calls
        run: npm run audit:no-ai
