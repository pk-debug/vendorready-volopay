name: Deploy VendorReady to Cloudflare

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type DEPLOY to publish VendorReady"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == 'DEPLOY' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$D1_DATABASE_ID" || (echo "::error::Missing D1_DATABASE_ID" && exit 1)
          test -n "$DEMO_PASSWORD" || (echo "::error::Missing DEMO_PASSWORD" && exit 1)
          test -n "$SESSION_SECRET" || (echo "::error::Missing SESSION_SECRET" && exit 1)
          test -n "$MCP_API_KEY" || (echo "::error::Missing MCP_API_KEY" && exit 1)
          node -e "if (process.env.SESSION_SECRET.length < 32 || process.env.MCP_API_KEY.length < 32) process.exit(1)"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Set the D1 database ID
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const id = process.env.D1_DATABASE_ID ?? "";
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) {
            throw new Error("D1_DATABASE_ID must be a valid UUID copied from Cloudflare D1.");
          }
          const path = "wrangler.jsonc";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.d1_databases[0].database_id = id;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc --yes

      - name: Build and deploy Worker plus web assets
        run: npm run deploy

      - name: Set encrypted Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$DEMO_PASSWORD" | npx wrangler secret put DEMO_PASSWORD --config wrangler.jsonc
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET --config wrangler.jsonc
          printf '%s' "$MCP_API_KEY" | npx wrangler secret put MCP_API_KEY --config wrangler.jsonc

      - name: Show endpoint paths
        run: |
          echo "Copy the actual workers.dev URL from the deploy output."
          echo "Health check path: /api/health"
          echo "MCP path: /mcp"
